name: Release on main

# When a merge lands on main, cut a GitHub Release whose tag matches the
# version declared in pyproject.toml ([project].version). The job is
# idempotent: if the tag v<version> already exists it is skipped, so merges
# that don't bump the version (or re-runs) do nothing. Bump the version in
# pyproject.toml in the PR, and merging to main publishes the matching release.

on:
  push:
    branches: [main]

# Only the latest push to main matters; cancel any superseded run.
concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write # create tags and releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to detect an existing tag

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version $version (tag v$version)"

      - name: Create release if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists — nothing to release."
            exit 0
          fi
          echo "::notice::Creating release $TAG at $GITHUB_SHA"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
