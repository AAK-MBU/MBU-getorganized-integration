[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mbu-getorganized-integration"
version = "0.3.0"
description = "GetOrganized (GO) client + PDF conversion for AAK-MBU (Linux-first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AAK-MBU" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "requests >= 2.31",
    "requests-ntlm >= 1.3",
]

[project.optional-dependencies]
# PDF conversion paths (mbu_getorganized_integration.pdf). Office/email
# conversion additionally needs LibreOffice installed on the host (apt-get
# install libreoffice) — it is not a pip dependency.
pdf = [
    "Pillow >= 10.0",
    "extract-msg >= 0.48",
    "pypdf >= 4.0",
]
dev = [
    "pytest",
    "Pillow >= 10.0",
    "extract-msg >= 0.48",
    "pypdf >= 4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbu_getorganized_integration = ["py.typed"]
